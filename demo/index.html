<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>readme-pet · interactive demo</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #7ee787;
    --red: #ff7b72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    padding: 2rem 1rem;
  }
  main { width: min(560px, 100%); }
  h1 {
    font-size: 1.25rem;
    letter-spacing: -0.02em;
    margin: 0 0 0.25rem;
  }
  h1 .lvl { color: var(--muted); font-weight: 400; }
  p.sub { color: var(--muted); font-size: 0.8rem; margin: 0 0 1.25rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1rem 0.9rem;
  }
  .pet-slot { display: grid; place-items: center; padding: 0.25rem 0 0.4rem; }
  .pet-slot svg { width: 100%; height: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.9rem 0 0.4rem; }
  button {
    font: inherit;
    font-size: 0.8rem;
    color: var(--text);
    background: #21262d;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.05s;
  }
  button:hover { background: #30363d; border-color: #8b949e; }
  button:active { transform: translateY(1px); }
  button.brew { border-style: dashed; }
  #tick-log {
    min-height: 1.1em;
    font-size: 0.75rem;
    color: var(--muted);
    margin: 0 0 0.8rem;
  }
  .stats h2 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0.6rem 0 0.5rem;
  }
  .chip { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.7rem; font-size: 0.78rem; }
  .chip span { background: #21262d; border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem 0.6rem; }
  .chip b { color: var(--green); }
  .bar {
    display: grid;
    grid-template-columns: 5.5rem 1fr 2.6rem;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.75rem;
    margin: 0.4rem 0;
  }
  .bar .lbl { color: var(--muted); }
  .track { background: #21262d; border: 1px solid var(--border); border-radius: 999px; height: 10px; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 999px; transition: width 0.25s ease; }
  .bar .val { color: var(--text); text-align: right; }
  footer { margin-top: 1rem; font-size: 0.7rem; color: var(--muted); text-align: center; line-height: 1.5; }
  footer code { background: #161b22; border: 1px solid var(--border); border-radius: 4px; padding: 0 0.3em; }
</style>
</head>
<body>
  <main>
    <h1>🐣 readme-pet <span class="lvl">playground</span></h1>
    <p class="sub">An interactive demo of the generator's pet renderer — zero build tooling, ES modules only.</p>

    <section class="panel" aria-label="pet playground">
      <!-- main.js injects the 400×200 pet SVG here -->
      <div class="pet-slot" id="pet-slot"></div>

      <div class="actions" role="group" aria-label="pet actions">
        <button id="feed" type="button">🍖 Feed</button>
        <button id="play" type="button">🎾 Play</button>
        <button id="heal" type="button">💊 Heal</button>
        <button id="tick" type="button">☀️ Tick</button>
        <button id="breed" class="brew" type="button">🧬 Breed</button>
      </div>

      <p id="tick-log" aria-live="polite"></p>

      <!-- main.js fills these -->
      <div class="stats">
        <div class="chip" id="chip"></div>
        <div id="bars" aria-label="pet stats"></div>
      </div>
    </section>

    <footer>
      Mirrors <code>src/renderer.js</code> + <code>src/engine.js</code> · try
      <code>npx serve demo/</code> or <code>npm run demo</code> (Vite)
    </footer>
  </main>

  <!-- Relative path: resolves to /demo/main.js under Vite dev, and works
       when demo/ is served as a static root (npx serve demo/). -->
  <script type="module" src="./main.js"></script>
</body>
</html>
